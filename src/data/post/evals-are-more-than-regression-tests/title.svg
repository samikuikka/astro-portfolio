<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- apo design language: pure black, gray panel, square corners,
       color only as state (green = expected, red = received / FAIL). -->
  <rect width="1200" height="630" fill="#000000"/>

  <rect x="110" y="110" width="980" height="410" fill="#161616" stroke="#292929" stroke-width="2"/>

  <g font-family="JetBrains Mono, JetBrainsMono NF, monospace" font-size="27" letter-spacing="0">
    <text x="154" y="181" fill="#ededed"><tspan fill="#5fe6ad">$</tspan> apo task run ./tasks/t-calculator-batching</text>

    <text x="154" y="273" font-weight="700"><tspan fill="#cf4c4c">FAIL</tspan><tspan fill="#ededed"> t-calculator-batching</tspan></text>
    <text x="154" y="319" font-weight="700" fill="#ededed">  Checks:</text>
    <text x="154" y="365" fill="#ededed">    <tspan fill="#cf4c4c">✗</tspan> calculator-calls-batched</text>
    <text x="154" y="411" fill="#4db168">        − Expected: at most 5 calculator calls</text>
    <text x="154" y="457" fill="#cf4c4c">        + Received: 20 calculator calls</text>
  </g>
</svg>
